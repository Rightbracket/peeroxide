[package]
name = "libudx"
version = "1.7.4"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Pure Rust implementation of the UDX protocol (tokio-compatible)"
readme = "README.md"
keywords = ["udp", "transport", "networking", "p2p", "congestion-control"]
categories = ["network-programming", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
socket2 = "0.6"
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# For the two socket options in `native::sockopt`. Both are already in the
# tree, through tokio and socket2.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
rand = "0.9"
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber = "0.3"
