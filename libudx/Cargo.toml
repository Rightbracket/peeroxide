[package]
name = "libudx"
version = "1.7.4"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Pure Rust implementation of the UDX protocol (tokio-compatible)"
readme = "README.md"
keywords = ["udp", "transport", "networking", "p2p", "congestion-control"]
categories = ["network-programming", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
socket2 = "0.6"
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# For the two socket options in `native::pmtu`, which rustix sets and reads
# through safe calls.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["net"] }

[dev-dependencies]
rand = "0.9"
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber = "0.3"
